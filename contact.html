        <section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="contact-card">
                <h1 class="text-center mb-3">Get In Touch</h1>


                <form action="#" method="post">

                    <!-- Full Name -->
                    <div class="mb-3">
                        <label for="fullName" class="form-label">
                            Full Name
                        </label>
                        <input type="text"
                               class="form-control"
                               id="fullName"
                               name="fullName"
                               placeholder="Enter your full name"
                               required>
                    </div>

                    <!-- Email Address -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email Address
                        </label>
                        <input type="email"
                               class="form-control"
                               id="email"
                               name="email"
                               placeholder="Enter your email address"
                               required>
                    </div>

                    <!-- Subject -->
                    <div class="mb-3">
                        <label for="subject" class="form-label">
                            Subject
                        </label>
                        <input type="text"
                               class="form-control"
                               id="subject"
                               name="subject"
                               placeholder="Enter the subject"
                               required>
                    </div>

                    <!-- Message -->
                    <div class="mb-4">
                        <label for="message" class="form-label">
                            Message
                        </label>
                        <textarea class="form-control"
                                  id="message"
                                  name="message"
                                  rows="5"
                                  placeholder="Write your message here..."
                                  required></textarea>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit"
                            class="btn btn-accent w-100">
                        Send Message
                    </button>

                </form>
            </div>

        </div>
    </div>
</section>
